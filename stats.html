<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats · Curtis Champions League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#171a21">
  <meta name="apple-mobile-web-app-title" content="Curtis League">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Curtis Champions League">
  <meta property="og:title" content="Stats · Curtis Champions League">
  <meta property="og:description" content="Standings, fixtures, playoffs and Elo for our FIFA league.">
  <meta property="og:url" content="https://alexbronstein16.github.io/fifa-league/stats.html">
  <meta property="og:image" content="https://alexbronstein16.github.io/fifa-league/img/icon-512.png">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <nav id="nav"></nav>
  <script src="js/nav.js"></script>

  <main>
    <h1>Stats</h1>
    <div class="filters" id="views"></div>

    <h2 id="awards-title">Awards</h2>
    <p class="note" id="awards-note"></p>
    <div class="awards" id="awards">Loading…</div>

    <h2>Hall of shame</h2>
    <div class="awards shame" id="shame"></div>

    <h2>Fun stats</h2>
    <div class="awards" id="fun"></div>

    <h2>Player superlatives</h2>
    <p class="note">Everyone's best finish across the awards and fun stats.</p>
    <div class="supers" id="supers"></div>

    <h2 id="board-title">Leaderboard</h2>
    <div class="table-wrap" id="board-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th class="left">Player</th><th>GP</th><th>W</th><th>D</th><th>L</th>
            <th>Win %</th><th class="hide-sm">GF</th><th class="hide-sm">GA</th><th>Elo ±</th>
          </tr>
        </thead>
        <tbody id="board"></tbody>
      </table>
    </div>

    <h2>Clubs</h2>
    <p class="note" id="clubs-note"></p>
    <div class="table-wrap" id="clubs-wrap">
      <table>
        <thead>
          <tr>
            <th class="left">Club</th><th>GP</th><th>W</th><th>D</th><th>L</th>
            <th>Win %</th><th class="hide-sm">Goals / game</th><th class="left">Best with it</th>
          </tr>
        </thead>
        <tbody id="clubs"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { getTeams, getAllTeams, getAllMatches } from "./js/db.js";
    import { computeElo } from "./js/elo.js";
    import { computeStandings } from "./js/standings.js";
    import { buildBracket } from "./js/bracket.js";
    import { entriesFor, computeStats, superlatives, playerTable, bestGuests, clubTable } from "./js/stats.js";
    import { LEAGUE } from "./js/config.js";
    import { esc, crestIcon, playerLink } from "./js/ui.js";

    const $ = id => document.getElementById(id);
    const signed = n => (n > 0 ? "+" : "") + n;
    const MEDALS = ["🥇", "🥈", "🥉"];
    const ORDINAL = ["1st", "2nd", "3rd"];
    let view = new URLSearchParams(location.search).get("view") === "friendlies" ? "friendlies" : "league";
    let data = null;

    // "value detail [opponent]", e.g. "4–1 vs Sam" or "12 goals in 8 games"
    function line(item, team) {
      return `<b>${esc(item.value)}</b>${item.detail ? ` ${esc(item.detail)}` : ""}${
        item.other ? ` ${playerLink(team(item.other))}` : ""}`;
    }

    // one tile: the leader in full, then 2nd and 3rd underneath
    function tile(s, team) {
      const [first, ...rest] = s.list;
      return `
        <div class="award">
          <span class="award-icon">${s.icon}</span>
          <div class="award-body">
            <small>${esc(s.label)}</small>
            <div class="award-who">${crestIcon(team(first.teamId))}${playerLink(team(first.teamId))}</div>
            <div class="award-detail">${line(first, team)}</div>
            ${rest.length ? `<ol class="podium">${rest.map((it, i) => `
              <li><span class="rank">${i + 2}</span><span>${crestIcon(team(it.teamId))}${playerLink(team(it.teamId))}
                · <b>${esc(it.value)}</b>${it.other ? ` vs ${playerLink(team(it.other))}` : ""}</span></li>`).join("")}</ol>` : ""}
          </div>
        </div>`;
    }

    function render() {
      const { leagueTeams, teams, matches, ratings, history } = data;
      const byId = new Map(teams.map(t => [t.id, t]));
      const team = id => byId.get(id);
      const leagueIds = new Set(leagueTeams.map(t => t.id));
      window.history.replaceState(null, "", view === "friendlies" ? "?view=friendlies" : location.pathname);

      // ---- view switch ----
      $("views").innerHTML = [["league", `League · Season ${LEAGUE.season}`], ["friendlies", "Friendlies"]]
        .map(([k, label]) => `<button class="chip" data-view="${k}" aria-pressed="${k === view}">${label}</button>`).join("");

      let entries, stats, note, eligible, people;
      if (view === "league") {
        // league + playoff games this season, league players only (forfeits weren't really played)
        entries = entriesFor(matches, m => m.season === LEAGUE.season && m.stage !== "friendly" && !m.forfeit);
        eligible = leagueIds;
        stats = computeStats(entries, history, { eligible, eloLabel: "this season" })
          .filter(s => s.key !== "wins" && s.key !== "active" && s.key !== "spoon");  // the table covers these

        // the table and bracket use every result, forfeits included
        const season = matches.filter(m => m.season === LEAGUE.season && m.stage !== "friendly");
        const standings = computeStandings(leagueTeams, season, LEAGUE.points);
        const bracket = buildBracket(standings, season, LEAGUE.playoffSpots);
        const started = season.some(m => m.stage === "league");
        if (bracket.champion) {
          stats.unshift({ group: "award", key: "champion", icon: "🏆", label: "Champion",
            list: [{ teamId: bracket.champion, value: "Won the playoffs", detail: "" }] });
        } else if (started) {
          stats.unshift({ group: "award", key: "leader", icon: "🥇", label: "Top of the table",
            list: standings.slice(0, 3).map(r => ({ teamId: r.team.id, value: `${r.pts} pts`, detail: `from ${r.p} games` })) });
        }
        // wooden spoon = bottom of the table, worst first
        if (started && standings.length > 1) {
          stats.push({ group: "shame", key: "spoon", icon: "🥄", label: "Wooden spoon",
            list: standings.slice(-3).reverse().map((r, i) => ({ teamId: r.team.id, value: `${r.pts} pts`,
              detail: i === 0 ? `last place after ${r.p} games` : "" })) });
        }
        people = leagueIds;
        note = bracket.champion
          ? `Final results for Season ${LEAGUE.season}: league and playoff games.`
          : `Season ${LEAGUE.season} so far: league and playoff games. Updates after every game until the playoffs finish.`;
      } else {
        // every friendly ever, everyone including guests
        entries = entriesFor(matches, m => m.stage === "friendly");
        eligible = null;
        stats = computeStats(entries, history, { eloLabel: "from friendlies" });
        const guestIds = new Set(teams.filter(t => !t.in_league).map(t => t.id));
        people = new Set(entries.flatMap(([m]) => [m.home_team_id, m.away_team_id]));
        const guests = bestGuests(ratings, guestIds, people);
        if (guests) stats.push(guests);
        note = "All friendlies, all seasons, guests included. Friendlies move Elo at half weight.";
      }

      // drop anyone who's been deleted, and tiles left empty by that
      stats = stats.map(s => ({ ...s, list: s.list.filter(it => team(it.teamId) && (!it.other || team(it.other))) }))
        .filter(s => s.list.length);
      const tiles = (group, empty) => stats.filter(s => s.group === group).map(s => tile(s, team)).join("")
        || `<p class="note">${empty}</p>`;

      $("awards-title").textContent = view === "league" ? `Season ${LEAGUE.season} awards` : "Friendly awards";
      $("awards-note").textContent = note;
      $("awards").innerHTML = tiles("award", "Awards appear once games are played.");
      $("shame").innerHTML = tiles("shame", "Nobody to shame yet.");
      $("fun").innerHTML = tiles("fun", "Fun stats appear once a few games are played.");

      // ---- player superlatives: everyone's best finish ----
      const played = new Set(entries.flatMap(([m]) => [m.home_team_id, m.away_team_id]));
      const supers = superlatives(stats, [...people].filter(id => team(id) && played.has(id)));
      $("supers").innerHTML = supers.map(p => {
        const t = team(p.id);
        const what = p.stat
          ? `${ORDINAL[p.rank]} · ${p.stat.label} · ${p.item.value}`
          : "No podium finish yet";
        return `
          <div class="super">
            <span class="medal">${p.stat ? MEDALS[p.rank] : "·"}</span>
            <div class="super-body">
              <div>${crestIcon(t)}${playerLink(t)}</div>
              <small>${p.stat ? `${p.stat.icon} ` : ""}${esc(what)}</small>
            </div>
          </div>`;
      }).join("") || `<p class="note">Appears once games are played.</p>`;

      // ---- leaderboard ----
      const rows = playerTable(entries, history)
        .filter(r => team(r.id) && (!eligible || eligible.has(r.id)))
        .sort((a, b) => b.w - a.w || b.winPct - a.winPct || b.gd - a.gd);
      $("board-title").textContent = view === "league" ? "Season leaderboard" : "Friendlies leaderboard";
      $("board-wrap").hidden = !rows.length;
      $("board").innerHTML = rows.map((r, i) => {
        const elo = Math.round(r.elo);
        const t = team(r.id);
        return `
          <tr>
            <td>${i + 1}</td>
            <td class="left">${crestIcon(t)}${playerLink(t)}${t.in_league ? "" : `<small class="tag">guest</small>`}</td>
            <td>${r.gp}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
            <td>${Math.round(r.winPct * 100)}%</td>
            <td class="hide-sm">${r.gf}</td><td class="hide-sm">${r.ga}</td>
            <td class="${elo > 0 ? "up" : elo < 0 ? "down" : ""}">${elo ? signed(elo) : "–"}</td>
          </tr>`;
      }).join("");

      // ---- clubs (same games as the view) ----
      const games = entries.map(([m]) => m);
      const clubs = clubTable(games);
      const withClub = games.filter(m => m.home_club || m.away_club).length;
      $("clubs-wrap").hidden = !clubs.length;
      $("clubs-note").textContent = clubs.length
        ? `Clubs recorded in ${withClub} of ${games.length} games.`
        : "No clubs recorded for these games yet. Add them when reporting a game.";
      $("clubs").innerHTML = clubs.map(c => `
        <tr>
          <td class="left">${esc(c.club)}</td>
          <td>${c.gp}</td><td>${c.w}</td><td>${c.d}</td><td>${c.l}</td>
          <td>${Math.round(c.winPct * 100)}%</td>
          <td class="hide-sm">${(c.gf / c.gp).toFixed(1)}</td>
          <td class="left">${crestIcon(team(c.topId))}${playerLink(team(c.topId))}
            <small class="note-inline">${c.topW}W in ${c.topGp}</small></td>
        </tr>`).join("");
    }

    try {
      const [leagueTeams, teams, matches] = await Promise.all([getTeams(), getAllTeams(), getAllMatches()]);
      const { ratings, history } = computeElo(teams, matches, LEAGUE.elo);
      data = { leagueTeams, teams, matches, ratings, history };
      render();
    } catch (e) {
      $("awards").textContent = `Couldn't load stats: ${e.message}`;
      console.error(e);
    }

    $("views").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip || !data) return;
      view = chip.dataset.view;
      render();
    });
  </script>
</body>
</html>
