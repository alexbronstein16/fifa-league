<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playoffs · Curtis Champions League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#171a21">
  <meta name="apple-mobile-web-app-title" content="Curtis League">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Curtis Champions League">
  <meta property="og:title" content="Playoffs · Curtis Champions League">
  <meta property="og:description" content="Standings, fixtures, playoffs and Elo for our FIFA league.">
  <meta property="og:url" content="https://alexbronstein16.github.io/fifa-league/playoffs.html">
  <meta property="og:image" content="https://alexbronstein16.github.io/fifa-league/img/icon-512.png">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <nav id="nav"></nav>
  <script src="js/nav.js"></script>

  <main>
    <h1>Playoffs</h1>
    <p class="note" id="status"></p>
    <div class="bracket" id="bracket">Loading…</div>
  </main>

  <script type="module">
    import { getTeams, getMatches } from "./js/db.js";
    import { computeStandings } from "./js/standings.js";
    import { buildBracket } from "./js/bracket.js";
    import { LEAGUE } from "./js/config.js";
    import { badge, playerLink } from "./js/ui.js";

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g,
      c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    try {
      const [teams, matches] = await Promise.all([getTeams(), getMatches()]);
      const standings = computeStandings(teams, matches, LEAGUE.points);
      const bracket = buildBracket(standings, matches);

      const team = id => teams.find(t => t.id === id);
      const seedOf = id => bracket.seeds.indexOf(id) + 1;

      // goals (and pens) for one side of a tie, whichever was home
      const score = (m, id) => {
        if (!m) return "";
        const home = m.home_team_id === id;
        const g = home ? m.home_goals : m.away_goals;
        const p = home ? m.home_pens : m.away_pens;
        return p != null ? `${g} <small>(${p})</small>` : `${g}`;
      };

      const side = (tie, id) => {
        const t = team(id);
        if (!t) return `<div class="side tbd"><span>${tie.bye ? "Bye" : "TBD"}</span></div>`;
        const cls = tie.winner == null ? "" : tie.winner === id ? "won" : "lost";
        return `
          <div class="side ${cls}">
            <span>
              <small class="seed">${seedOf(id)}</small>
              ${badge(t)}
              ${playerLink(t)}
            </span>
            <b>${score(tie.match, id)}</b>
          </div>`;
      };

      $("bracket").innerHTML = bracket.rounds.map(r => `
        <div class="round">
          <h2>${r.name}</h2>
          ${r.ties.map(tie => `
            <div class="tie">${side(tie, tie.a)}${side(tie, tie.b)}</div>`).join("")}
        </div>`).join("");

      const champ = team(bracket.champion);
      const started = matches.some(m => m.stage === "playoff");
      $("status").innerHTML = champ
        ? `🏆 Champion: <b>${esc(champ.name)}</b>`
        : started ? "Playoffs in progress."
        : "Projected bracket: seeded by the current standings.";
    } catch (e) {
      $("bracket").textContent = `Couldn't load playoffs: ${e.message}`;
      console.error(e);
    }
  </script>
</body>
</html>
