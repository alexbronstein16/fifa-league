<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player · Curtis Champions League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#171a21">
  <meta name="apple-mobile-web-app-title" content="Curtis League">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Curtis Champions League">
  <meta property="og:title" content="Player · Curtis Champions League">
  <meta property="og:description" content="Standings, fixtures, playoffs and Elo for our FIFA league.">
  <meta property="og:url" content="https://alexbronstein16.github.io/fifa-league/player.html">
  <meta property="og:image" content="https://alexbronstein16.github.io/fifa-league/img/icon-512.png">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <nav id="nav"></nav>
  <script src="js/nav.js"></script>

  <main>
    <div id="header">Loading…</div>
    <div id="recap-box"></div>

    <div class="filters" id="filters"></div>

    <div class="tiles" id="tiles"></div>

    <h2>Insights</h2>
    <ul class="insights" id="insights"></ul>

    <h2>Elo over time <small class="note">all games</small></h2>
    <div id="elo"></div>

    <h2>Achievements <small class="note" id="ach-count"></small></h2>
    <div id="achievements"></div>

    <h2>Head to head</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th class="left">Opponent</th><th>GP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th></th></tr>
        </thead>
        <tbody id="h2h"></tbody>
      </table>
    </div>

    <h2>Clubs</h2>
    <p class="note" id="club-note"></p>
    <div class="table-wrap" id="club-table">
      <table>
        <thead>
          <tr><th class="left">Club</th><th>GP</th><th>W</th><th>D</th><th>L</th><th>Win %</th><th>GF</th><th>GA</th></tr>
        </thead>
        <tbody id="clubs"></tbody>
      </table>
    </div>

    <h2>Match history</h2>
    <div class="fx-card" id="history"></div>
  </main>

  <script type="module">
    import { getAllTeams, getAllMatches } from "./js/db.js";
    import { computeElo } from "./js/elo.js";
    import { playerGames, summarize, headToHead, clubStats } from "./js/player.js";
    import { computeAchievements, ACHIEVEMENTS, GROUP_NAMES } from "./js/achievements.js";
    import { computeStandings } from "./js/standings.js";
    import { recapButton } from "./js/recap.js";
    import { LEAGUE } from "./js/config.js";
    import { esc, badge, playerLink, matchRow } from "./js/ui.js";

    const $ = id => document.getElementById(id);
    const signed = n => (n > 0 ? "+" : "") + n;
    const pct = n => `${Math.round(n * 100)}%`;
    const one = n => n.toFixed(1);
    const day = iso => new Date(iso).toLocaleDateString();
    const short = iso => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const STAGES = [["all", "All"], ["league", "League"], ["playoff", "Playoffs"], ["friendly", "Friendlies"]];
    const STAGE_LABEL = { league: "League", playoff: "Playoff", friendly: "Friendly" };

    const playerId = Number(new URLSearchParams(location.search).get("id"));
    let teams = [], allGames = [], stage = "all";
    let halves = null;  // this season's table split in two, for "record vs top half"
    const matchById = new Map();
    const team = id => teams.find(t => t.id === id);

    async function main() {
      const matches = await getAllMatches();
      for (const m of matches) matchById.set(m.id, m);
      teams = await getAllTeams();
      const me = team(playerId);
      if (!me) {
        $("header").innerHTML = `<h1>Player not found</h1>`;
        return;
      }
      document.title = `${me.name} · Curtis Champions League`;

      const { ratings, history } = computeElo(teams, matches, LEAGUE.elo);
      allGames = playerGames(playerId, matches, history);

      // this season's table: used for "vs top half / bottom half" and the season card
      const leagueTeams = teams.filter(t => t.in_league);
      const season = matches.filter(m => m.season === LEAGUE.season && m.stage !== "friendly");
      const table = computeStandings(leagueTeams, season, LEAGUE.points);
      if (season.some(m => m.stage === "league") && table.length >= 4) {
        const cut = Math.ceil(table.length / 2);
        halves = { top: new Set(table.slice(0, cut).map(r => r.team.id)),
                   bottom: new Set(table.slice(cut).map(r => r.team.id)) };
      }
      const ach = computeAchievements(teams, matches, history, LEAGUE);

      drawHeader(me, ratings, matches);
      recapButton($("recap-box"), { me, team, games: allGames, table, ach, season: LEAGUE.season });
      drawFilters();
      drawElo(allGames);
      drawAchievements(ach);
      render();
    }

    // ---------- header ----------
    function drawHeader(me, ratings, matches) {
      const played = new Set(matches.flatMap(m => [m.home_team_id, m.away_team_id]));
      const ranked = teams.filter(t => played.has(t.id))
                          .sort((a, b) => ratings.get(b.id) - ratings.get(a.id));
      const rank = ranked.findIndex(t => t.id === me.id) + 1;
      const elo = Math.round(ratings.get(me.id) ?? LEAGUE.elo.start);
      const peak = Math.round(Math.max(LEAGUE.elo.start, ...allGames.map(g => g.elo)));

      const crest = me.crest_url
        ? `<img class="crest-lg" src="${esc(me.crest_url)}" alt="">`
        : `<div class="crest-lg placeholder" style="background:${esc(me.color)}">${esc(me.short_name || me.name[0])}</div>`;
      const details = [me.owner_name, me.club, me.in_league ? "League" : "Guest"]
        .filter(Boolean).map(esc).join(" · ");

      $("header").innerHTML = `
        <div class="profile" style="border-top-color:${esc(me.color)}">
          ${crest}
          <div class="profile-name">
            <h1>${esc(me.name)}</h1>
            <p class="note">${details}</p>
          </div>
          <div class="profile-elo">
            <div class="big">${elo}</div>
            <small>Elo${rank ? ` · #${rank} of ${ranked.length}` : ""} · peak ${peak}</small>
          </div>
        </div>`;
    }

    // ---------- filter chips ----------
    function drawFilters() {
      $("filters").innerHTML = STAGES.map(([key, label]) => {
        const n = key === "all" ? allGames.length : allGames.filter(g => g.stage === key).length;
        return `<button class="chip" data-stage="${key}" aria-pressed="${key === stage}">${label} <small>${n}</small></button>`;
      }).join("");
    }

    $("filters").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      stage = btn.dataset.stage;
      drawFilters();
      render();
    });

    // ---------- everything that depends on the filter ----------
    function render() {
      const shown = allGames.filter(g => stage === "all" || g.stage === stage);
      const games = shown.filter(g => !g.forfeit);  // stats only count games actually played
      const forfeits = shown.length - games.length;
      const s = summarize(games);
      const h2h = headToHead(games);
      const clubs = clubStats(games);
      const withClub = games.filter(g => g.club).length;
      const fave = clubs[0];
      const best = clubs.filter(c => c.gp >= 3).sort((a, b) => b.w / b.gp - a.w / a.gp)[0];

      if (!s.gp && !shown.length) {
        $("tiles").innerHTML = `<p class="note">No games in this category yet.</p>`;
        $("insights").innerHTML = "";
        $("h2h").innerHTML = "";
        $("clubs").innerHTML = "";
        $("club-note").textContent = "";
        $("club-table").hidden = true;
        $("history").innerHTML = "";
        $("history").hidden = true;
        return;
      }

      // stat tiles
      const tile = (label, big, sub = "") =>
        `<div class="tile"><small>${label}</small><div class="big">${big}</div>${sub ? `<small>${sub}</small>` : ""}</div>`;
      $("tiles").innerHTML = [
        tile("Record", `${s.w}-${s.d}-${s.l}`, `${s.gp} games${forfeits ? ` · ${forfeits} forfeit${forfeits > 1 ? "s" : ""} not counted` : ""}`),
        tile("Win %", pct(s.winPct)),
        tile("Goals for", s.gf, `${one(s.avgFor)} per game`),
        tile("Goals against", s.ga, `${one(s.avgAgainst)} per game`),
        tile("Goal diff", signed(s.gd)),
        tile("Clean sheets", s.cleanSheets, s.gp ? pct(s.cleanSheets / s.gp) : "–"),
        tile("Streak", s.streak),
      ].join("") + `<div class="tile tile-wide"><small>Last ${Math.min(10, games.length)}</small><div class="big">${
        games.slice(-10).map(g => `<span class="form ${g.result}">${g.result}</span>`).join("")}</div></div>`;

      // insights
      const vs = g => `${g.gf}–${g.ga} vs ${playerLink(team(g.opp))} <small>${day(g.date)}</small>`;
      const fav = [...h2h].filter(r => r.w > 0).sort((a, b) => b.w - a.w)[0];
      const nem = [...h2h].filter(r => r.l > 0).sort((a, b) => b.l - a.l)[0];
      const rec = list => { const w = list.filter(g => g.result === "W").length, d = list.filter(g => g.result === "D").length;
        return `${w}-${d}-${list.length - w - d}`; };
      const topGames = halves ? games.filter(g => halves.top.has(g.opp)) : [];
      const botGames = halves ? games.filter(g => halves.bottom.has(g.opp)) : [];
      const eloPts = allGames.filter(g => g.elo != null);
      const peak = eloPts.length && eloPts.reduce((a, b) => b.elo > a.elo ? b : a);
      const low = eloPts.length && eloPts.reduce((a, b) => b.elo < a.elo ? b : a);
      const items = [
        peak && peak.elo > LEAGUE.elo.start && ["Peak Elo", `${Math.round(peak.elo)} <small>${day(peak.date)}</small>`],
        low && low.elo < LEAGUE.elo.start && ["Lowest Elo", `${Math.round(low.elo)} <small>${day(low.date)}</small>`],
        topGames.length && ["Vs top half of the table", `${rec(topGames)} <small>${topGames.length} games</small>`],
        botGames.length && ["Vs bottom half", `${rec(botGames)} <small>${botGames.length} games</small>`],
        s.biggestWin && ["Biggest win", vs(s.biggestWin)],
        s.worstLoss && ["Worst loss", vs(s.worstLoss)],
        ["Longest win streak", `${s.longestWin} games`],
        ["Longest unbeaten run", `${s.longestUnbeaten} games`],
        fav && ["Favorite opponent", `${playerLink(team(fav.opp))} <small>${fav.w}-${fav.d}-${fav.l}</small>`],
        nem && ["Nemesis", `${playerLink(team(nem.opp))} <small>${nem.w}-${nem.d}-${nem.l}</small>`],
        fave && ["Favorite club", `${esc(fave.club)} <small>${fave.gp} games</small>`],
        best && ["Best club", `${esc(best.club)} <small>${pct(best.w / best.gp)} wins</small>`],
        ["Failed to score", `${s.blanks} of ${s.gp} games`],
      ].filter(Boolean);
      $("insights").innerHTML = items.map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join("");

      // head to head
      $("h2h").innerHTML = h2h.map(r => `
        <tr>
          <td class="left">${badge(team(r.opp))}${playerLink(team(r.opp))}</td>
          <td>${r.gp}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
          <td>${r.gf}</td><td>${r.ga}</td>
          <td><a class="h2h-link" href="h2h.html?a=${playerId}&b=${r.opp}">H2H</a></td>
        </tr>`).join("");

      // clubs
      $("club-table").hidden = !clubs.length;
      $("club-note").textContent = clubs.length
        ? `Club recorded for ${withClub} of ${games.length} games.`
        : "No clubs recorded yet. Add them when reporting a game.";
      $("clubs").innerHTML = clubs.map(c => `
        <tr>
          <td class="left">${esc(c.club)}</td>
          <td>${c.gp}</td><td>${c.w}</td><td>${c.d}</td><td>${c.l}</td>
          <td>${pct(c.w / c.gp)}</td><td>${c.gf}</td><td>${c.ga}</td>
        </tr>`).join("");

      // match history: newest first, last 5 visible, the rest behind "Show all"
      const newest = [...shown].reverse();  // history lists forfeits too, tagged FF
      const row = g => {
        const change = Math.round(g.eloChange);
        return matchRow(matchById.get(g.id), team, {
          status: `<span class="form ${g.result}">${g.result}</span>`,
          elo: { text: signed(change), cls: change > 0 ? "up" : change < 0 ? "down" : "" },
        });
      };
      const older = newest.slice(5);
      $("history").hidden = false;
      $("history").innerHTML = newest.slice(0, 5).map(row).join("") + (older.length ? `
        <div class="fx-more" hidden>${older.map(row).join("")}</div>
        <button class="fx-showall">Show ${older.length} older ${older.length === 1 ? "match" : "matches"}</button>` : "");
    }

    // ---------- Elo chart (all games, not filtered) ----------
    function drawElo(games) {
      const box = $("elo");
      if (games.length < 2) {
        box.innerHTML = `<p class="note">The chart appears after two games.</p>`;
        return;
      }
      const start = LEAGUE.elo.start;
      const pts = [{ elo: start }, ...games];
      const W = 600, H = 180, L = 44, R = 10, T = 12, B = 12;
      const vals = pts.map(p => p.elo);
      const max = Math.max(...vals), min = Math.min(...vals);
      const pad = Math.max(18, (max - min) * 0.22);  // room for the peak and low labels
      const hi = max + pad, lo = min - pad;
      const step = (W - L - R) / (pts.length - 1);
      const x = i => L + i * step;
      const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
      const label = v => `<text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
      const farFromStart = v => Math.abs(y(v) - y(start)) > 14;
      const peakI = vals.indexOf(max), lowI = vals.indexOf(min);
      // a ringed dot with a label, kept inside the chart
      const marker = (i, word, dy) => {
        if (i === 0) return "";
        const anchor = x(i) > W - 90 ? "end" : x(i) < L + 60 ? "start" : "middle";
        return `<circle class="mark" cx="${x(i)}" cy="${y(vals[i])}" r="5"/>
          <text class="mark-label" x="${x(i)}" y="${Math.min(H - 2, Math.max(11, y(vals[i]) + dy))}" text-anchor="${anchor}">${word} ${Math.round(vals[i])} · ${short(pts[i].date)}</text>`;
      };

      box.innerHTML = `
        <div class="chart-wrap">
          <svg viewBox="0 0 ${W} ${H}" class="elo-chart" role="img" aria-label="Elo rating after each game">
            <line class="ref" x1="${L}" x2="${W - R}" y1="${y(start)}" y2="${y(start)}"/>
            ${label(start)}
            ${farFromStart(max) ? label(max) : ""}
            ${farFromStart(min) ? label(min) : ""}
            <polyline class="line" points="${pts.map((p, i) => `${x(i)},${y(p.elo)}`).join(" ")}"/>
            ${pts.length <= 80 ? pts.slice(1).map((p, i) =>
              `<circle class="gdot ${p.forfeit ? "F" : p.result}" cx="${x(i + 1)}" cy="${y(p.elo)}" r="3"/>`).join("") : ""}
            ${marker(peakI, "Peak", -10)}
            ${lowI !== peakI && pts[lowI].elo < start ? marker(lowI, "Low", 20) : ""}
            <circle class="hover-dot" r="5" visibility="hidden"/>
          </svg>
          <div class="tip" hidden></div>
        </div>`;

      const svg = box.querySelector("svg");
      const dot = box.querySelector(".hover-dot");
      const tip = box.querySelector(".tip");

      svg.addEventListener("pointermove", e => {
        const r = svg.getBoundingClientRect();
        const vx = (e.clientX - r.left) * W / r.width;
        const i = Math.min(pts.length - 1, Math.max(0, Math.round((vx - L) / step)));
        const p = pts[i];
        dot.setAttribute("cx", x(i));
        dot.setAttribute("cy", y(p.elo));
        dot.setAttribute("visibility", "visible");
        tip.innerHTML = i === 0
          ? `Start · <b>${start}</b>`
          : `${p.result} ${p.gf}–${p.ga} vs ${esc(team(p.opp)?.name ?? "?")}<br>
             <b>${Math.round(p.elo)}</b> (${signed(Math.round(p.eloChange))}) · ${day(p.date)}`;
        tip.hidden = false;
        const px = x(i) / W * r.width;
        tip.style.left = `${Math.min(Math.max(px, 80), r.width - 80)}px`;
      });
      svg.addEventListener("pointerleave", () => {
        dot.setAttribute("visibility", "hidden");
        tip.hidden = true;
      });
    }

    // ---------- achievements (all games, not filtered) ----------
    function drawAchievements(ach) {
      const mine = ach.byPlayer.get(playerId) ?? new Map();
      const of = ach.players.size;
      const card = (a, got) => {
        const n = ach.rarity.get(a.key) ?? 0;
        const when = got ? `${short(got.date)}${got.opp ? ` vs ${esc(team(got.opp)?.name ?? "?")}` : ""}${
          got.count > 1 ? ` · <b>×${got.count}</b>` : ""}` : "";
        return `
          <div class="badge-card${got ? "" : " locked"}${a.group === "shame" ? " shame" : ""}" title="${esc(a.desc)}">
            <span class="badge-icon">${a.icon}</span>
            <div class="badge-body">
              <div>${esc(a.name)}</div>
              <small>${esc(a.desc)}</small>
              <small class="badge-meta">${got ? when : "Locked"} · ${n ? `${n} of ${of} ${of === 1 ? "player" : "players"}` : "nobody yet"}</small>
            </div>
          </div>`;
      };
      const earned = ACHIEVEMENTS.filter(a => mine.has(a.key) && a.group !== "shame");
      const shame = ACHIEVEMENTS.filter(a => mine.has(a.key) && a.group === "shame");
      const locked = ACHIEVEMENTS.filter(a => !mine.has(a.key) && a.group !== "shame");
      $("ach-count").textContent = `${earned.length} of ${ACHIEVEMENTS.filter(a => a.group !== "shame").length}`;
      // newest unlocks first
      earned.sort((a, b) => mine.get(b.key).date.localeCompare(mine.get(a.key).date));
      $("achievements").innerHTML = `
        ${earned.length ? `<div class="badges">${earned.map(a => card(a, mine.get(a.key))).join("")}</div>`
          : `<p class="note">No achievements yet.</p>`}
        ${shame.length ? `<h3 class="badge-h">Shame</h3><div class="badges">${shame.map(a => card(a, mine.get(a.key))).join("")}</div>` : ""}
        ${locked.length ? `<details class="locked-list"><summary>Still to unlock (${locked.length})</summary>
          <div class="badges">${locked.map(a => card(a, null)).join("")}</div></details>` : ""}`;
    }

    $("history").addEventListener("click", e => {
      const more = e.target.closest(".fx-showall");
      if (!more) return;
      more.previousElementSibling.hidden = false;
      more.remove();
    });

    main().catch(e => {
      $("header").innerHTML = `<p>Couldn't load player: ${esc(e.message)}</p>`;
      console.error(e);
    });
  </script>
</body>
</html>
