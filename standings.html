<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standings · FIFA League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
</head>
<body>
  <nav id="nav"></nav>
  <script src="js/nav.js"></script>

  <main>
    <h1>Standings</h1>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th class="left">Team</th>
            <th>P</th><th>W</th><th>D</th><th>L</th>
            <th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
            <th>Elo</th>
            <th class="hide-sm">Form</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="12">Loading…</td></tr></tbody>
      </table>
    </div>
    <p class="note" id="note"></p>
  </main>

  <script type="module">
    import { getTeams, getMatches, getAllMatches } from "./js/db.js";
    import { computeStandings } from "./js/standings.js";
    import { computeElo } from "./js/elo.js";
    import { LEAGUE } from "./js/config.js";

    const tbody = document.getElementById("rows");
    const esc = s => String(s ?? "").replace(/[&<>"]/g,
      c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const badge = t => t.crest_url
      ? `<img class="crest" src="${esc(t.crest_url)}" alt="">`
      : `<span class="dot" style="background:${esc(t.color)}"></span>`;

    try {
      const [teams, matches, allMatches] =
        await Promise.all([getTeams(), getMatches(), getAllMatches()]);
      const table = computeStandings(teams, matches, LEAGUE.points);
      const { ratings } = computeElo(teams, allMatches, LEAGUE.elo);

      tbody.innerHTML = table.map((r, i) => `
        <tr class="${i === LEAGUE.playoffSpots - 1 ? "cutoff" : ""}">
          <td>${i + 1}</td>
          <td class="left">${badge(r.team)}${esc(r.team.name)}</td>
          <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
          <td>${r.gf}</td><td>${r.ga}</td>
          <td>${r.gd > 0 ? "+" : ""}${r.gd}</td>
          <td class="pts">${r.pts}</td>
          <td>${Math.round(ratings.get(r.team.id) ?? LEAGUE.elo.start)}</td>
          <td class="hide-sm">${r.form.map(f =>
            `<span class="form ${f}">${f}</span>`).join("")}</td>
        </tr>`).join("");

      const played = matches.filter(m => m.stage === "league").length;
      document.getElementById("note").textContent =
        `${played} league matches played. Top ${LEAGUE.playoffSpots} make the playoffs.`;
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="12">Couldn't load standings: ${esc(e.message)}</td></tr>`;
      console.error(e);
    }
  </script>
</body>
</html>
