<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Head to Head · Curtis Champions League</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#171a21">
  <meta name="apple-mobile-web-app-title" content="Curtis League">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Curtis Champions League">
  <meta property="og:title" content="Head to Head · Curtis Champions League">
  <meta property="og:description" content="Standings, fixtures, playoffs and Elo for our FIFA league.">
  <meta property="og:url" content="https://alexbronstein16.github.io/fifa-league/h2h.html">
  <meta property="og:image" content="https://alexbronstein16.github.io/fifa-league/img/icon-512.png">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <nav id="nav"></nav>
  <script src="js/nav.js"></script>

  <main>
    <h1>Head to head</h1>

    <div class="h2h-pick">
      <select id="pick-a" aria-label="First player"></select>
      <button class="secondary" id="swap" title="Swap" aria-label="Swap players">⇄</button>
      <select id="pick-b" aria-label="Second player"></select>
    </div>

    <div id="h2h">Loading…</div>
  </main>

  <script type="module">
    import { getAllTeams, getAllMatches } from "./js/db.js";
    import { computeElo, expected } from "./js/elo.js";
    import { LEAGUE } from "./js/config.js";
    import { esc, playerLink, matchRow } from "./js/ui.js";

    const $ = id => document.getElementById(id);
    const STAGES = [["all", "All"], ["league", "League"], ["playoff", "Playoffs"], ["friendly", "Friendlies"]];
    let teams = [], matches = [], ratings = new Map(), stage = "all";
    const team = id => teams.find(t => t.id === id);

    const crestBig = t => t.crest_url
      ? `<img class="crest-lg" src="${esc(t.crest_url)}" alt="">`
      : `<div class="crest-lg placeholder" style="background:${esc(t.color)}">${esc(t.short_name || t.name[0])}</div>`;

    // one side's numbers across a list of meetings
    function side(id, games) {
      const s = { w: 0, d: 0, l: 0, gf: 0, cs: 0, best: null, clubs: new Map() };
      for (const m of games) {
        const home = m.home_team_id === id;
        const gf = home ? m.home_goals : m.away_goals;
        const ga = home ? m.away_goals : m.home_goals;
        s.gf += gf;
        if (ga === 0) s.cs++;
        if (gf > ga) s.w++; else if (gf < ga) s.l++; else s.d++;
        if (gf > ga && (!s.best || gf - ga > s.best.gf - s.best.ga)) s.best = { gf, ga };
        const club = (home ? m.home_club : m.away_club)?.trim();
        if (club) s.clubs.set(club, (s.clubs.get(club) ?? 0) + 1);
      }
      s.topClub = [...s.clubs].sort((x, y) => y[1] - x[1])[0]?.[0] ?? null;
      return s;
    }

    function render() {
      const a = Number($("pick-a").value), b = Number($("pick-b").value);
      history.replaceState(null, "", `?a=${a}&b=${b}`);
      const A = team(a), B = team(b);
      if (!A || !B || a === b) { $("h2h").innerHTML = `<p class="note">Pick two different players.</p>`; return; }

      const all = matches.filter(m =>
        (m.home_team_id === a && m.away_team_id === b) || (m.home_team_id === b && m.away_team_id === a));
      const games = all.filter(m => stage === "all" || m.stage === stage);
      const ra = ratings.get(a) ?? LEAGUE.elo.start, rb = ratings.get(b) ?? LEAGUE.elo.start;
      const pa = Math.round(expected(ra, rb) * 100);
      const sa = side(a, games), sb = side(b, games);
      const n = games.length;
      const per = x => n ? (x / n).toFixed(1) : "–";
      const best = s => s.best ? `${s.best.gf}–${s.best.ga}` : "–";

      // comparison rows: the bigger number is highlighted (or smaller, for lower-is-better)
      const row = (label, x, y, { lower = false, show = v => v, compare = true } = {}) => {
        const nx = parseFloat(x), ny = parseFloat(y);
        const aWins = compare && !isNaN(nx) && !isNaN(ny) && nx !== ny && (lower ? nx < ny : nx > ny);
        const bWins = compare && !isNaN(nx) && !isNaN(ny) && nx !== ny && !aWins;
        return `
          <div class="cmp-row">
            <span class="cmp-val${aWins ? " lead" : ""}" style="${aWins ? `--c:${esc(A.color)}` : ""}">${show(x)}</span>
            <span class="cmp-label">${label}</span>
            <span class="cmp-val${bWins ? " lead" : ""}" style="${bWins ? `--c:${esc(B.color)}` : ""}">${show(y)}</span>
          </div>`;
      };

      const chips = STAGES.map(([key, label]) => {
        const c = key === "all" ? all.length : all.filter(m => m.stage === key).length;
        return `<button class="chip" data-stage="${key}" aria-pressed="${key === stage}">${label} <small>${c}</small></button>`;
      }).join("");

      $("h2h").innerHTML = `
        <div class="h2h-top">
          <a class="h2h-side" href="player.html?id=${a}">${crestBig(A)}<b>${esc(A.name)}</b><small>Elo ${Math.round(ra)}</small></a>
          <div class="h2h-record">
            <div class="big">${sa.w} – ${sa.d} – ${sb.w}</div>
            <small>wins · draws · wins</small>
          </div>
          <a class="h2h-side" href="player.html?id=${b}">${crestBig(B)}<b>${esc(B.name)}</b><small>Elo ${Math.round(rb)}</small></a>
        </div>

        <div class="odds">
          <div class="odds-label"><span>${pa}%</span><small>Elo odds for the next game</small><span>${100 - pa}%</span></div>
          <div class="odds-bar">
            <span style="width:${pa}%;background:${esc(A.color)}"></span>
            <span style="width:${100 - pa}%;background:${esc(B.color)}"></span>
          </div>
        </div>

        <div class="filters">${chips}</div>

        ${n ? `
          <div class="cmp">
            ${row("Wins", sa.w, sb.w)}
            ${row("Goals", sa.gf, sb.gf)}
            ${row("Goals per game", per(sa.gf), per(sb.gf))}
            ${row("Clean sheets", sa.cs, sb.cs)}
            ${row("Biggest win", best(sa), best(sb), { compare: false })}
            ${row("Most used club", sa.topClub ?? "–", sb.topClub ?? "–", { show: v => esc(v), compare: false })}
          </div>

          <h2>Meetings</h2>
          <div class="fx-card">${[...games].reverse().map(m => matchRow(m, team)).join("")}</div>`
        : `<p class="note">They haven't played${stage === "all" ? "" : " in this category"} yet.</p>`}`;
    }

    try {
      [teams, matches] = await Promise.all([getAllTeams(), getAllMatches()]);
      ({ ratings } = computeElo(teams, matches, LEAGUE.elo));

      const options = teams.map(t =>
        `<option value="${t.id}">${esc(t.name)}${t.in_league ? "" : " (guest)"}</option>`).join("");
      $("pick-a").innerHTML = options;
      $("pick-b").innerHTML = options;

      // start from the URL (?a=1&b=2), else the two top-rated players
      const q = new URLSearchParams(location.search);
      const byElo = [...teams].sort((x, y) => (ratings.get(y.id) ?? 0) - (ratings.get(x.id) ?? 0));
      const valid = id => teams.some(t => t.id === id);
      const qa = Number(q.get("a")), qb = Number(q.get("b"));
      $("pick-a").value = valid(qa) ? qa : byElo[0]?.id;
      $("pick-b").value = valid(qb) && qb !== Number($("pick-a").value) ? qb
        : byElo.find(t => t.id !== Number($("pick-a").value))?.id;

      render();
    } catch (e) {
      $("h2h").textContent = `Couldn't load: ${e.message}`;
      console.error(e);
    }

    $("pick-a").addEventListener("change", render);
    $("pick-b").addEventListener("change", render);
    $("swap").addEventListener("click", () => {
      const a = $("pick-a").value;
      $("pick-a").value = $("pick-b").value;
      $("pick-b").value = a;
      render();
    });
    $("h2h").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      stage = chip.dataset.stage;
      render();
    });
  </script>
</body>
</html>
